name: Deploy naar GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installeren
        run: npm ci

      - name: Base path bepalen
        run: echo "BASE_PATH=/" >> "$GITHUB_ENV"

      - name: Bouwen
        run: npm run build
        env:
          PUBLIC_CORRECTION_ENDPOINT: ${{ vars.PUBLIC_CORRECTION_ENDPOINT }}

      - name: Pages configureren
        uses: actions/configure-pages@v5

      - name: Artefact uploaden
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
